[project]
name = "airflow-etl-pipeline-viewer"
version = "1.0.0"
description = "FastAPI viewer for the Airflow ETL pipeline, plus unit tests for the ETL scripts"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pandas>=2.1",
    "pyarrow>=15",
]

[dependency-groups]
dev = ["pytest>=8", "requests>=2.31"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "data_collection"]
